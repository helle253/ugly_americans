title: ugly americans
description: sample jekyll + js (esbuild) on github pages
theme: minima

# ensure links work both locally and on pages
url: ""
baseurl: ""

markdown: kramdown

plugins:
  - jekyll-feed

exclude:
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - bun.lockb
  - pnpm-lock.yaml
  - yarn.lock
  - build.mjs
  - src
  - .github

# keep assets/build in the site; it's generated by the js build step
include:
  - assets/build

